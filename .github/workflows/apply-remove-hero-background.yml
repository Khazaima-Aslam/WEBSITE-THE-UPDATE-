name: Apply Remove Hero Background Image

on:
  push:
    branches: [fix-remove-hero-background-image]
    paths:
      - '.github/workflows/apply-remove-hero-background.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix-remove-hero-background-image
          fetch-depth: 0

      - name: Remove static homepage hero background image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          css = Path('assets/css/styles.css')
          text = css.read_text()
          old = '  background:url("../img/hero-site.webp") center/cover no-repeat var(--dark);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one hero-site background rule, found {text.count(old)}')
          text = text.replace(old, '  background:var(--dark);')
          text = text.replace(
              'blends into the poster frame painted underneath on .hero__media',
              'blends into the dark base painted underneath on .hero__media'
          )
          css.write_text(text)
          PY

      - name: Verify picture cannot render under hero video
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'hero-site.webp' assets/css/styles.css
          grep -q 'background:var(--dark);' assets/css/styles.css
          ! grep -q 'poster="' index.html
          ! grep -q 'hero-720.mp4' assets/js/public-forms.js
          ! grep -q 'hero-540.mp4' assets/js/public-forms.js
          grep -q 'hero-architecture-v2-' assets/js/app.js

      - name: Commit CSS hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/styles.css
          git commit -m 'Remove static image behind homepage hero video'
          git push origin HEAD:fix-remove-hero-background-image
