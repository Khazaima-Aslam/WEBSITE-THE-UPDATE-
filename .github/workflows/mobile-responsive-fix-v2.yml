name: Mobile Responsive Production Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-responsive-fix-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile CSS overrides
        shell: bash
        env:
          MOBILE_CSS_B64: ""
        run: |
          set -euo pipefail
          python3 -c 'import base64,os,pathlib; p=pathlib.Path("assets/css/styles.css"); s=p.read_text(); marker="CKA MOBILE RESPONSIVE PATCH v23"; css=base64.b64decode(os.environ["MOBILE_CSS_B64"]).decode(); p.write_text(s if marker in s else s+"\n"+css)'
          rm -f .github/workflows/mobile-responsive-fix.yml .github/workflows/mobile-responsive-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/styles.css .github/workflows/mobile-responsive-fix.yml .github/workflows/mobile-responsive-fix-v2.yml
          git commit -m "Improve mobile responsiveness and video framing"
          git push
