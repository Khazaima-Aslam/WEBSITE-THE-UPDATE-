name: Generate HD BOQ Carousel

on:
  push:
    branches: [homepage-boq-hd-carousel]
    paths:
      - '.github/workflows/generate-boq-hd.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: homepage-boq-hd-carousel
          fetch-depth: 0
      - name: Generate HD BOQ SVGs
        run: python scripts/generate_boq_hd_svgs.py
      - name: Verify generated files
        run: |
          test -s assets/img/boq-carousel-hd-1.svg
          test -s assets/img/boq-carousel-hd-2.svg
          test -s assets/img/boq-carousel-hd-3.svg
          grep -q 'Quantity TakeOff' assets/img/boq-carousel-hd-1.svg
          grep -q 'Quantity TakeOff' assets/img/boq-carousel-hd-2.svg
          grep -q 'Quantity TakeOff' assets/img/boq-carousel-hd-3.svg
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/boq-carousel-hd-1.svg assets/img/boq-carousel-hd-2.svg assets/img/boq-carousel-hd-3.svg
          git commit -m 'Generate HD BOQ carousel images'
          git push origin HEAD:homepage-boq-hd-carousel
