name: Apply hero video poster fix

on:
  push:
    branches:
      - fix-home-hero-video-poster

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-home-hero-video-poster

      - name: Patch hero video behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          old = '<video id="hero-video" class="hero__video" autoplay muted loop playsinline preload="metadata" poster="assets/img/hero-site.webp">'
          new = '<video id="hero-video" class="hero__video" autoplay muted loop playsinline preload="auto">'
          assert old in s, 'hero video markup not found'
          index.write_text(s.replace(old, new, 1))

          css = Path('assets/css/styles.css')
          s = css.read_text()
          old = '.hero__video{ width:100%; height:100%; object-fit:cover; display:block; }'
          new = '''.hero__video{\n  width:100%; height:100%; object-fit:cover; display:block;\n  opacity:0; background:var(--dark); transition:opacity .28s ease;\n}\n.hero__video.is-on{ opacity:1; }\n.hero__video.is-looping{ opacity:.72; }'''
          assert old in s, 'hero video CSS rule not found'
          css.write_text(s.replace(old, new, 1))

          app = Path('assets/js/app.js')
          s = app.read_text()
          old = '''  if (heroVideo) {\n    const turnOn = () => heroVideo.classList.add("is-on");\n    heroVideo.addEventListener("canplay", turnOn);\n    heroVideo.addEventListener("playing", turnOn);\n    heroVideo.addEventListener("error", turnOn); // poster + bg fallback\n    if (reducedMotion) {\n      heroVideo.removeAttribute && heroVideo.removeAttribute("autoplay");\n      heroVideo.pause && heroVideo.pause();\n      turnOn(); // show the poster frame as a still hero\n    } else {\n      const src = (navigator.connection && navigator.connection.saveData) || mq("(max-width: 700px)")\n        ? "540" : "720";\n      heroVideo.src = "assets/video/hero-" + src + ".mp4";\n      try { const p = heroVideo.play && heroVideo.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}\n\n    }\n  }'''
          new = '''  if (heroVideo) {\n    const turnOn = () => heroVideo.classList.add("is-on");\n    const turnOff = () => heroVideo.classList.remove("is-on");\n    heroVideo.removeAttribute("poster");\n    heroVideo.addEventListener("playing", turnOn);\n    heroVideo.addEventListener("waiting", turnOff);\n    heroVideo.addEventListener("stalled", turnOff);\n    heroVideo.addEventListener("error", turnOff);\n    if (reducedMotion) {\n      heroVideo.removeAttribute && heroVideo.removeAttribute("autoplay");\n      heroVideo.pause && heroVideo.pause();\n      turnOff(); // keep the existing dark hero background; never show a still image\n    } else {\n      const src = (navigator.connection && navigator.connection.saveData) || mq("(max-width: 700px)")\n        ? "540" : "720";\n      heroVideo.src = "assets/video/hero-" + src + ".mp4";\n      try { const p = heroVideo.play && heroVideo.play(); if (p && p.catch) p.catch(turnOff); } catch (e) { turnOff(); }\n\n    }\n  }'''
          assert old in s, 'hero video JS block not found'
          app.write_text(s.replace(old, new, 1))

          Path('.github/workflows/hero-video-poster-fix.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix homepage hero video poster flash"
          git push origin HEAD:fix-home-hero-video-poster
