name: Apply HD BOQ Carousel

on:
  push:
    branches: [homepage-boq-hd-carousel]
    paths:
      - '.github/workflows/apply-boq-hd.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: homepage-boq-hd-carousel
          fetch-depth: 0
      - name: Point homepage carousel to HD files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for i in (1,2,3):
              old=f'assets/img/boq-carousel-{i}.webp'
              new=f'assets/img/boq-carousel-hd-{i}.svg'
              if old not in s:
                  raise SystemExit(f'Missing expected {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify HD carousel wiring
        run: |
          grep -q 'boq-carousel-hd-1.svg' index.html
          grep -q 'boq-carousel-hd-2.svg' index.html
          grep -q 'boq-carousel-hd-3.svg' index.html
          ! grep -q 'boq-carousel-1.webp' index.html
          test -s assets/img/boq-carousel-hd-1.svg
          test -s assets/img/boq-carousel-hd-2.svg
          test -s assets/img/boq-carousel-hd-3.svg
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use HD BOQ images in homepage carousel'
          git push origin HEAD:homepage-boq-hd-carousel
