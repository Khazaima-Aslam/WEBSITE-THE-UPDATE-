name: Finalize Homepage Copy

on:
  push:
    branches: [apple-premium-public-redesign]
    paths:
      - .github/workflows/sync-provided-hero.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: apple-premium-public-redesign
          fetch-depth: 0

      - name: Update homepage source copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
            '<h1>Source <em>smarter.</em><br />Build <em>better.</em></h1>': '<h1>Build with confidence.</h1>',
            "CKA BuildStruct is Pakistan's managed construction procurement platform &mdash; connecting project owners, builders and contractors with verified suppliers through live market rates, BOQ-based quotations and professional design support.": "CKA BuildStruct is Pakistan's managed construction procurement platform, connecting project owners, builders and contractors with verified suppliers through live market rates, BOQ based quotations and professional design support.",
            'Rated <strong>4.9/5</strong> by 2,300+ project owners &mdash; Rawalpindi &middot; Islamabad &middot; Lahore': 'Rated <strong>4.9/5</strong> by 2,300+ project owners in Rawalpindi, Islamabad and Lahore',
            'Drawings, materials and<br />live sites &mdash; in one place.': 'Drawings, materials and<br />live sites in one place.',
            'field-verified drawings': 'field verified drawings',
            'Wherever you are in your project &mdash;': 'Wherever you are in your project',
            'Cement, steel, bricks and sand rates every morning &mdash; plus quotation support for your BOQ.': 'Cement, steel, bricks and sand rates every morning, plus quotation support for your BOQ.',
            'IBFT / RTGS &mdash; details shared with quotation': 'IBFT / RTGS. Details shared with quotation'
          }
          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit('Expected homepage copy not found: ' + repr(missing))
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one time helper and commit
        run: |
          set -euo pipefail
          rm .github/workflows/sync-provided-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/sync-provided-hero.yml
          git commit -m 'Finalize homepage copy without decorative dashes'
          git push origin HEAD:apple-premium-public-redesign
