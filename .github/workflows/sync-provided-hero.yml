name: Prepare Provided Hero Video

on:
  push:
    branches: [apple-premium-public-redesign]
    paths:
      - .github/workflows/sync-provided-hero.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: apple-premium-public-redesign
          fetch-depth: 0

      - name: Install video downloader
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Download the supplied architectural animation
        run: |
          set -euo pipefail
          yt-dlp \
            --no-playlist \
            --js-runtimes node \
            --extractor-args 'youtube:player_client=tv_embedded,web_safari' \
            -f 'bestvideo[height<=720]+bestaudio/best[height<=720]' \
            --merge-output-format mp4 \
            -o '/tmp/cka-source.%(ext)s' \
            'https://www.youtube.com/watch?v=OP_fVIUTr9Y'
          SOURCE="$(find /tmp -maxdepth 1 -type f -name 'cka-source.*' | head -n 1)"
          test -n "$SOURCE"
          ffprobe -v error "$SOURCE"

      - name: Trim branded ending and create web hero files
        run: |
          set -euo pipefail
          SOURCE="$(find /tmp -maxdepth 1 -type f -name 'cka-source.*' | head -n 1)"
          mkdir -p assets/video
          ffmpeg -y -i "$SOURCE" -t 14.50 -an \
            -vf 'scale=1280:-2:flags=lanczos' \
            -c:v libx264 -preset medium -crf 28 -pix_fmt yuv420p \
            -movflags +faststart assets/video/hero-720.mp4
          ffmpeg -y -i "$SOURCE" -t 14.50 -an \
            -vf 'scale=960:-2:flags=lanczos' \
            -c:v libx264 -preset medium -crf 30 -pix_fmt yuv420p \
            -movflags +faststart assets/video/hero-540.mp4
          test "$(stat -c%s assets/video/hero-720.mp4)" -gt 500000
          test "$(stat -c%s assets/video/hero-540.mp4)" -gt 300000
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 assets/video/hero-720.mp4

      - name: Commit prepared hero media
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/video/hero-720.mp4 assets/video/hero-540.mp4; then
            echo 'Hero video already matches generated output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/hero-720.mp4 assets/video/hero-540.mp4
          git commit -m 'Use supplied architectural animation for homepage hero'
          git push origin HEAD:apple-premium-public-redesign
