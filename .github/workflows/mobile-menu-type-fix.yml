name: Fix mobile menu and homepage typography

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-menu-type-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile menu and phone typography
        shell: bash
        env:
          PATCH_SCRIPT_B64: ""
        run: |
          set -euo pipefail
          echo "$PATCH_SCRIPT_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          rm -f .github/workflows/mobile-menu-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js index.html assets/css/apple-premium.css .github/workflows/mobile-menu-type-fix.yml
          git commit -m "Repair mobile menu and refine homepage phone typography"
          git push
