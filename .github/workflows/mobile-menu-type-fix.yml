name: Fix mobile menu and homepage typography

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-menu-type-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile menu and phone typography
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('assets/js/app.js')
          s = app.read_text()
          old = '  $("#cart-open").addEventListener("click", openDrawer);'
          new = '  const cartOpen = $("#cart-open") || $("#cart-btn");\n  if (cartOpen) cartOpen.addEventListener("click", openDrawer);'
          if old in s:
              s = s.replace(old, new, 1)
          app.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          if '<body class="home-page">' not in s:
              s = s.replace('<body>', '<body class="home-page">', 1)
          index.write_text(s)

          css = Path('assets/css/apple-premium.css')
          s = css.read_text()
          marker = '/* CKA HOME MOBILE TYPE PATCH v2 */'
          if marker not in s:
              s += r'''

/* CKA HOME MOBILE TYPE PATCH v2 */
@media (max-width:640px){
  .home-page{
    font-size:14.5px;
    line-height:1.45;
  }
  .home-page .hero h1{
    font-size:30px;
    line-height:1.03;
    letter-spacing:-.022em;
  }
  .home-page .hero .lead{
    font-size:15px;
    line-height:1.48;
  }
  .home-page h2{
    font-size:24px;
    line-height:1.12;
  }
  .home-page h3{
    font-size:17px;
  }
  .home-page .sec-head__note,
  .home-page .lead,
  .home-page p{
    font-size:14.5px;
  }
  .home-page .kicker{
    font-size:10px;
  }
  .home-page .hero__trust{
    font-size:12px;
    line-height:1.4;
  }
  .home-page .stat__label{
    font-size:11px;
  }
  .home-page .hero__brands,
  .home-page .hero__brands p{
    font-size:11.5px;
  }
  .home-page .showcase-tile figcaption strong{
    font-size:13px;
  }
  .home-page .showcase-tile figcaption span{
    font-size:11.5px;
    line-height:1.35;
  }
  .home-page .btn{
    font-size:13px;
  }
}

@media (max-width:419px){
  .home-page{
    font-size:14px;
  }
  .home-page .hero h1{
    font-size:27px;
  }
  .home-page .hero .lead,
  .home-page p,
  .home-page .sec-head__note{
    font-size:14px;
  }
  .home-page h2{
    font-size:22px;
  }
}
'''
          css.write_text(s)
          PY

          rm -f .github/workflows/mobile-menu-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js index.html assets/css/apple-premium.css .github/workflows/mobile-menu-type-fix.yml
          git commit -m "Repair mobile menu and refine homepage phone typography"
          git push
