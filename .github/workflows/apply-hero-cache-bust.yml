name: Apply Hero Cache Bust Fix

on:
  push:
    branches: [fix-hero-cache-bust]
    paths:
      - '.github/workflows/apply-hero-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply hero cache-bust source patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hero-cache-bust
          fetch-depth: 0

      - name: Patch homepage hero sources and cache policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<video id="hero-video" class="hero__video" autoplay muted loop playsinline preload="auto">\n      <source src="assets/video/hero-720.mp4" type="video/mp4" />\n    </video>',
                        '<video id="hero-video" class="hero__video" autoplay muted loop playsinline preload="metadata"></video>')
          s = s.replace('assets/css/styles.css?v=21', 'assets/css/styles.css?v=22')
          s = s.replace('assets/js/app.js?v=21', 'assets/js/app.js?v=22')
          p.write_text(s)

          p = Path('assets/js/app.js')
          s = p.read_text()
          s = s.replace('"assets/video/hero-" + src + ".mp4"', '"assets/video/hero-architecture-v2-" + src + ".mp4"')
          p.write_text(s)

          p = Path('vercel.json')
          s = p.read_text()
          s = s.replace('{ "key": "Cache-Control", "value": "public, max-age=0, must-revalidate" }',
                        '{ "key": "Cache-Control", "value": "private, no-cache, no-store, max-age=0, must-revalidate" }', 1)
          p.write_text(s)
          PY

          grep -q 'hero-architecture-v2-' assets/js/app.js
          ! grep -q 'poster="' index.html
          ! grep -q 'assets/video/hero-720.mp4' index.html
          grep -q 'styles.css?v=22' index.html
          grep -q 'app.js?v=22' index.html
          grep -q 'no-store' vercel.json

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-hero-cache-bust.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply hero cache-bust source patch'
          git push origin HEAD:fix-hero-cache-bust
