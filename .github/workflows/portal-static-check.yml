name: Production Static Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [customer-supplier-bidding-portals, catalogue-admin-completion, material-detail-payment-verification]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check assets/js/backend-api.js
          node --check assets/js/account.js
          node --check assets/js/customer-portal.js
          node --check assets/js/supplier-portal.js
          node --check assets/js/admin-bidding.js
          node --check assets/js/admin-supplier-accounts.js
          node --check assets/js/admin-runtime.js
          node --check assets/js/admin-catalogue-pro.js
          node --check assets/js/public-catalogue.js
          node --check assets/js/material-card-links.js
          node --check assets/js/product-detail.js
          node --check assets/js/customer-payments.js
          node --check assets/js/admin-payments.js

      - name: Required production assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            account.html \
            customer-portal.html \
            supplier-portal.html \
            admin.html \
            product.html \
            assets/css/portal.css \
            assets/css/admin-catalogue-pro.css \
            assets/css/product-detail.css \
            assets/js/backend-api.js \
            assets/js/account.js \
            assets/js/customer-portal.js \
            assets/js/supplier-portal.js \
            assets/js/admin-bidding.js \
            assets/js/admin-supplier-accounts.js \
            assets/js/admin-runtime.js \
            assets/js/admin-catalogue-pro.js \
            assets/js/public-catalogue.js \
            assets/js/material-card-links.js \
            assets/js/product-detail.js \
            assets/js/customer-payments.js \
            assets/js/admin-payments.js; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Script references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/js/account.js' account.html
          grep -q 'assets/js/customer-portal.js' customer-portal.html
          grep -q 'assets/js/customer-payments.js' customer-portal.html
          grep -q 'assets/js/supplier-portal.js' supplier-portal.html
          grep -q 'account.html' suppliers.html
          grep -q 'admin-bidding.js' assets/js/backend-api.js
          grep -q 'admin-supplier-accounts.js' assets/js/admin-bidding.js
          grep -q 'admin-payments.js' assets/js/admin-bidding.js
          grep -q 'material-card-links.js' assets/js/public-catalogue.js
          grep -q 'assets/js/product-detail.js' product.html
          grep -q 'admin-runtime.js?v=2' admin.html
          grep -q 'admin-catalogue-pro.css' admin.html
          grep -q 'admin-catalogue-pro.js?v=1' assets/js/admin-runtime.js

      - name: Migration records
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            20260905123220_practical_line_item_bidding_v2.sql \
            20260905123446_fix_supplier_bid_revision_key.sql \
            20260905124020_customer_claimed_project_file_access.sql \
            20260905124219_supplier_sanitized_bid_history.sql \
            20260905124401_award_latest_supplier_revision_only.sql \
            20260905124644_anonymous_best_bid_benchmark.sql \
            20260905125009_supplier_portal_activation_by_verified_email.sql \
            20260905130020_index_quotes_awarded_bid.sql \
            20260905135551_catalogue_admin_atomic_product_and_category_management.sql \
            20260905135648_catalogue_admin_full_product_read.sql \
            20260905140033_catalogue_admin_atomic_batch_import.sql \
            20260905152844_quote_payment_proof_verification.sql \
            20260905153644_allow_rejected_payment_proof_resubmission.sql \
            20260905153930_harden_payment_rpc_security_boundary.sql \
            20260905154004_optimize_quote_payment_rls_and_review_index.sql; do
            test -s "db/migrations/$migration" || { echo "Missing migration: $migration"; exit 1; }
          done

      - name: Catalogue atomic API references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'staff_save_catalogue_product' assets/js/admin-catalogue-pro.js
          grep -q 'staff_catalogue_products' assets/js/admin-catalogue-pro.js
          grep -q 'staff_catalogue_categories' assets/js/admin-catalogue-pro.js
          grep -q 'staff_save_category' assets/js/admin-catalogue-pro.js
          grep -q 'staff_delete_category' assets/js/admin-catalogue-pro.js
          grep -q 'staff_import_catalogue_products' assets/js/admin-catalogue-pro.js

      - name: Payment verification references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'customer_payment_overview' assets/js/customer-payments.js
          grep -q 'customer_submit_payment' assets/js/customer-payments.js
          grep -q 'staff_quote_payment_overview' assets/js/admin-payments.js
          grep -q 'staff_review_payment' assets/js/admin-payments.js
          grep -q 'payment-proofs' assets/js/customer-payments.js
          grep -q 'product.html?id=' assets/js/material-card-links.js
