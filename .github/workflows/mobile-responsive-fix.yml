name: Apply mobile responsive fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-responsive-fix.yml"

permissions:
  contents: write

jobs:
  mobile-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append mobile production overrides
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "CKA MOBILE RESPONSIVE PATCH v23" assets/css/styles.css; then
            cat >> assets/css/styles.css <<'CSS'

/* ═══════════════════════════════════════════════════════════════
   CKA MOBILE RESPONSIVE PATCH v23
   Phone/tablet overrides only. Desktop remains unchanged.
   ═══════════════════════════════════════════════════════════════ */
@media (max-width:920px){
  html,body{ width:100%; max-width:100%; overflow-x:hidden; }
  img,video,iframe{ max-width:100%; }
  .container,.container--narrow{ width:calc(100% - 28px); max-width:100%; }

  .header__in{ gap:10px; }
  .brand{ min-width:0; }
  .brand__txt{ font-size:1rem; }

  .hero{
    min-height:clamp(620px,100svh,780px);
    padding:108px 0 72px;
    align-items:flex-end;
  }
  .hero__media{
    inset:0;
    transform:none !important;
    will-change:auto;
  }
  .hero__video,
  .hero__video.is-on{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    transform:none !important;
  }
  .hero__scrim{
    background:
      linear-gradient(180deg,rgba(9,13,21,.20) 0%,rgba(9,13,21,.40) 42%,rgba(9,13,21,.92) 100%),
      linear-gradient(90deg,rgba(9,13,21,.56),rgba(9,13,21,.18));
  }
  .hero__copy{ width:100%; max-width:620px; }
  .hero h1{ font-size:clamp(2.35rem,9.8vw,3.5rem); line-height:.98; }
  .hero .lead{ font-size:.98rem; line-height:1.55; }
  .hero__cta{ display:flex; flex-wrap:wrap; gap:10px; }
  .hero__cta .btn{ min-height:46px; }

  .sec-head{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
    margin-bottom:30px;
  }
  .sec-head__note{ max-width:100%; }

  .con-feature__media{
    aspect-ratio:16/10;
    min-height:0;
  }
  .con-video,.cta__video{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }
  .cta__media{ overflow:hidden; }
  .cta__in{ position:relative; z-index:2; }

  .showcase-tile img{ object-position:center center; }
  .tabpanel__media{ min-height:0; }
  .design-cat__head{ align-items:flex-start; }
  .design-cat__packages li{ align-items:flex-start; }
  .pill-tabs{ -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .pill-tabs::-webkit-scrollbar{ display:none; }

  .home-cta__actions{ flex-wrap:wrap; }
  .footer__in > *{ min-width:0; }
  table{ max-width:100%; }
}

@media (max-width:640px){
  :root{ --head-h:62px; }
  .container,.container--narrow{ width:calc(100% - 24px); }
  .header__in{ height:62px; }
  .brand__logo{ height:34px; }
  .brand__txt{ font-size:.94rem; }
  .topbar__right{ gap:10px; font-size:.74rem; }

  .hero{
    min-height:max(640px,100svh);
    padding:94px 0 58px;
  }
  .hero__video,.hero__video.is-on{ object-position:52% center; }
  .hero h1{ font-size:clamp(2.2rem,11vw,3rem); }
  .hero__cta{ flex-direction:column; align-items:stretch; }
  .hero__cta .btn{ width:100%; justify-content:center; }

  .con-feature__media{ aspect-ratio:4/3; }
  .con-feature__cap{ left:16px; right:16px; bottom:14px; }
  .con-feature__cap strong{ font-size:1rem; }
  .con-feature__cap span{ font-size:.78rem; line-height:1.45; }

  .showcase-grid{
    grid-template-columns:1fr;
    grid-auto-rows:240px;
  }
  .showcase-tile--lg{ grid-column:span 1; grid-row:span 1; }
  .showcase-tile figcaption{ left:14px; right:14px; bottom:13px; }

  .home-cta__actions{ display:grid; grid-template-columns:1fr; width:100%; }
  .home-cta__actions .btn{ width:100%; }

  .design-cat__head{ padding:12px; gap:12px; }
  .design-cat__thumb{ width:48px; height:48px; }
  .design-cat__body{ padding:16px; }
  .design-cat__packages li{ flex-direction:column; gap:3px; }

  .pill-tabs{ margin-inline:-12px; padding-inline:12px; }
  .mbar{ padding-bottom:env(safe-area-inset-bottom); }
  body{ padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
}

@media (max-width:420px){
  .hero{ min-height:max(620px,100svh); }
  .showcase-grid{ grid-auto-rows:230px; }
  .topbar__right{ width:100%; justify-content:center; }
}

@media (max-width:920px) and (orientation:landscape){
  .hero{ min-height:520px; padding:86px 0 48px; }
  .hero__video,.hero__video.is-on{ object-position:center 48%; }
}
CSS
          fi

          rm -f .github/workflows/mobile-responsive-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/styles.css .github/workflows/mobile-responsive-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Improve mobile responsiveness and video framing"
          git push
